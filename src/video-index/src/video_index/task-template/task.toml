schema_version = "1.0"

[task]
name = "video-index/{benchmark_name}__{task_id}"
authors = [
    { name = "Enxin Song" },
    { name = "Yinuo Xu" },
    { name = "Shusheng Yang" },
    { name = "Wenhao Chai" },
    { name = "Jiatao Gu" },
]
keywords = {keywords}

[metadata]
difficulty = "hard"
category = "video-understanding"
source_benchmark = "{source_benchmark}"
item_id = "{item_id}"
capability_group = "{capability_group}"
fine_category = "{fine_category}"
duration_s = {duration_s}
chance = {chance}
protocol = "{protocol}"

[verifier]
timeout_sec = 60.0
network_mode = "no-network"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com", "generativelanguage.googleapis.com"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
